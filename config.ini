## Параметры приложения
[App]
# Сохранять ли состояние в LocalStorage
save-state=true

# Показывать ли уведомления
show-notifications=true

# Язык интерфейса (ru, en)
language=ru

# Тема оформления (dark, light)
theme=dark

# Размер шрифта (small, medium, large)
font-size=medium
